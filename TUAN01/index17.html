<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Document</title>
        </head>
        <style>
            body{
                background-color: aquamarine;
                text-align: center;
            }
            .container{
                display: grid;
                grid-template-areas: "menu"
                                    "header"
                                    "image"
                                    "content"
                                    "maps";
                grid-template-columns: repeat(1, 1fr);
                justify-content: center;
                align-items: center;

            }
            .menu {
                grid-area: menu;
                display: flex;
                justify-content: space-around;
                align-items: center;
                background-color: #2c3e50;
                padding: 15px 30px;
                
                width: 100%;
                top:0%
                
            }

            .logo {
                color: white;
                font-size: 20px;
                font-weight: bold;
            }

            .items {
                list-style: none;
                display: flex;
                margin: 0;
                padding: 0;
            }

            .items li {
                margin-left: 30px;
            }

            .items li a {
                text-decoration: none;
                color: white;
                font-size: 16px;
                
            }

            .items li a:hover {
                color: #f39c12;
            }
            .header{
                grid-area: header;
                font-size: 30px;
                color:rgb(3, 3, 75);
                border: 1px solid rgb(0, 0, 0);
                background-color: rgba(7, 52, 249, 0.586);
            }
            .header h2{
                padding:20px;
                gap:20px;
            }
            .image{
                grid-area: image;
                display: flex;
                justify-content: space-around;
                border-radius: 30px;
                padding: 20px;
                gap: 20px
            }
            .image img{
                
                width: 500px;
                box-shadow: 0 4px 8px;
                border-radius: 20px;
                
            }
            .content{
                grid-area: content;
                display: flex;
                align-items: center;
                border:1px solid black;
                background-color: white;
                border-radius: 30px;
                width: auto;
                height: 200px;
                font-size: 20px;
                padding: 20px;
            }
            .maps{
                grid-area: maps;
                display: flex;
                justify-content: center;
                width: auto;
            }
            
        </style>
        <body>

            <div class="container">
                <div class="menu">
                    <nav class="navbar">
                        <div class="logo"> Du Lịch Việt</div>
                        <ul class="items">
                        <li><a href="#">Trang chủ</a></li>
                        <li><a href="#">Giới thiệu</a></li>
                        <li><a href="#">Điểm đến</a></li>
                        <li><a href="#">Liên hệ</a></li>
                        </ul>
                    </nav>
                </div>
                <h2 class="header">Vi Vu Hồ Lắk</h2>
                <div class="image">
                    <img src="image/lak2.jpg"  alt="Hồ Lắk">
                    <img src="image/lak.jpg"  alt="Hồ Lắk">
                </div>
                <div class="content">
                    <figcaption><i>Hồ Lắk, viên ngọc xanh của Tây Nguyên, là điểm đến lý tưởng cho những ai đam mê thiên nhiên và khám phá văn hóa bản địa.
                         Với diện tích gần 6,2km² và cao hơn 500m so với mực nước biển, hồ nước ngọt lớn nhất khu vực này được nuôi dưỡng bởi dòng sông Krông Ana,
                          mang đến làn nước trong xanh và yên bình.Bao quanh hồ là rừng nguyên sinh hùng vĩ, tạo nên bức tranh thiên nhiên thơ mộng, như một thước phim sống động 
                          của đất trời Tây Nguyên. Không chỉ có cảnh sắc tự nhiên làm say lòng người, Hồ Lắk còn là nơi hội tụ bản sắc văn hóa đậm đà của cộng đồng người M’nông. 
                          Những buôn làng truyền thống như Jun, M’Liêng hay Lê, nơi vẫn lưu giữ các giá trị văn hóa nguyên bản, đưa bạn về với nhịp sống mộc mạc, chân thật. 
                          Tại đây, bạn có thể khám phá kiến trúc nhà dài độc đáo, tham dự các lễ hội dân gian rộn ràng hay đơn giản là lắng nghe câu chuyện về núi rừng qua lời kể của người dân địa phương. </i></figcaption>
                </div>
                <div class="maps">
                    
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31497.00486815187!2d108.1788443374794!3d12.422873660908591!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31718eed92aa488f%3A0xee917753f710dc67!2zSOG7kyBM4bqvaw!5e0!3m2!1svi!2s!4v1751386677770!5m2!1svi!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </body>
    </html>

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

  <body>
    
    <div>
        <h2>Hello</h2>
        <input type="text" id="name" placeholder="nhập tên của bạn">
        <button onclick="sayhello()">Click here</button>
        <script>
            function sayhello() {
                const name = document.getElementById("name").value;
                console.log("Hello " + name);
            }
        </script>
    </div>
    <div>
        <h2>Web</h2>
        <input type="text" id="web" placeholder="nhap ten cua ban">
        <button onclick="onweb()">Hien thi</button>
        <div class="hienthi" id="hienthiweb"></div>
        <script>
            function onweb() {
                const name = document.getElementById("web").value;
                
                document.getElementById("hienthiweb").innerText = "hello "+ name;
            }
        </script>
    </div>
    <div>
        <h2> Sum 2 number</h2>
        <input type="text" id="num1" placeholder="so thu nhat">
        <input type="text" id="num2" placeholder="so thu hai">
        <button onclick="sum()">Sum</button>
        <div id="checksum"></div>
        <script>
            function sum() {
                const num1 = (document.getElementById("num1").value);
                const num2 = (document.getElementById("num2").value);
                if (!num1 || !num2) {
                    document.getElementById("checksum").innerText = "vui long nhap du 2 so";
                    
                    return;
                }
                if (isNaN(num1) || isNaN(num2)){
                    document.getElementById("checksum").innerText = "ban dang nhap 1 chuoi";
                    
                    return;
                }
                const sum = parseFloat(num1) +  parseFloat(num2)
                console.log("tong = " + sum)

            }
        </script>
    </div>
    <div>
        <h2> Co nhap hay chua?</h2>
        <input type="text" id="test" placeholder="nhap...">
        <button onclick="test()"> enter</button>
        <div id="checktext"></div>
        <script>
            function test(){
                const input = document.getElementById("test").value;
                const result = input ? "Đã nhập: " + input : "Bạn chưa nhập gì cả!";
                document.getElementById("checktext").innerText =result;
            }
        </script>
    </div>
    <div>
        <h2>Check type of input</h2>
        <input type="text" id="typetext" placeholder="Nhập...">
        <button onclick="checkType()">Enter</button>
        <div id="checktype"></div>
    
        <script>
            function checkType() {
                const value = document.getElementById("typetext").value.trim();
                const result = document.getElementById("checktype");
    
                if (isNaN(value)) {
                    result.innerText = "Bạn đang nhập một chuỗi.";
                    result.style.color = "red";
                } else {
                    result.innerText = "Bạn đang nhập một số.";
                    result.style.color = "green";
                }
            }
        </script>
    </div>
    
    <div>
        <h2> check phone number</h2>
        <input type="text" id="phone" placeholder="XXXXXXXXXX">
        <button onclick="check()">Check</button>
        <div id="checkphone"></div>
        <script>
            function check() {
                const phone = document.getElementById("phone").value.trim();
                const check = document.getElementById("checkphone");
                const regex = /^\d{10}$/;
                if (regex.test(phone)) {
                    check.innerText = "So dien thoai hop le";
                }
                else{
                    check.innerText = "so dien thoai khong hop le";
                }
            }
        </script>
    </div>
    <div>
        <h2>Kiểm tra số điện thoại (024)</h2>
        <input type="text" id="phone" placeholder="024-XXXXXXX">
        <button onclick="check024()">Check</button>
        <div id="check024"></div>
    
        <script>
            function check024() {
                const phone = document.getElementById("phone").value.trim();
                const result = document.getElementById("check024");
    
                const regex = /^024-\d{7}$/;
    
                if (regex.test(phone)) {
                    result.innerText = "✅ Số hợp lệ (024-XXXXXXX)";
                    result.style.color = "green";
                } else {
                    result.innerText = "❌ Số không hợp lệ. Định dạng đúng: 024-XXXXXXX";
                    result.style.color = "red";
                }
            }
        </script>
    </div>
    <div>
        <h2>kiem tra dinh dang 09</h2>
        <input type="text" id="phone" placeholder="09XXXXXXXX">
        <button onclick="check09()">Check</button>
        <div id="check09"></div>
        <script>
            function check09(){
                const phone = document.getElementById("phone").value.trim();
                const output = document.getElementById("check09");
                const regex = /^09\d{8}$/;
                if ( regex.test(phone)){
                    output.innerText = "so cua ban hop le";
                }
                else{
                    output.innerText = " so cua ban khong hop le"
                }
            }
        </script>
    </div>
    
    
    

  </body>
</html>

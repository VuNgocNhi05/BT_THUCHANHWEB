<DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Document</title>
        </head>
        <style>
            body{
                background-color: beige;
                text-align: center;
            }
            h2{
                border: 2px;
                background-color: aquamarine;
                gap:20px;
                padding: 10px;
                margin:auto;
                font-size:30px;
                color:rgb(17, 108, 108)
            }
            .form{
                display: flex;
                flex-direction: column;
                align-items: center;
                border: 2px;
                border-style: solid;
                background-color: azure;
                padding: 20px;
                width: fit-content;
                margin: auto;
                gap: 10px;
            }
            .inf{
                display: flex;
                flex-direction: column;
                gap:10px;

            }
            .form button{
                display: flex;
                justify-content: center;
                width: fit-content;
            }
            .inf input:hover{
                background-color: aquamarine;
            }
            .inf textarea:hover{
                background-color: aquamarine;
            }
            .form button:hover{
                background-color: aquamarine;
                transform: scale(1.25)
            }
        </style>
        <body>
           <h2> Form Đăng Nhập</h2> 
           <div class="form">
                <div class="inf">
                    <label>Username</label>
                    <input type="text" placeholder="username" required>
                </div>
                <div class="inf">
                    <label>Password</label>
                    <input type="text" placeholder="password" required>
                </div>
                <button type="submit">Log in</button>
           </div>
           <h2>Form Khảo Sát Ý Kiến Người Dùng</h2>

            <div class="form">
                <p>Ý Kiến Của Bạn Về Điện Thoại Samsung M15</p>
                <div class="inf">
                    <label>
                        <input type="radio" name="opinion" value="good"> Tốt
                    </label>
                    <label>
                        <input type="radio" name="opinion" value="bed"> Kém
                    </label>
                
                <p>Chọn các tính năng bạn thích</p>
                
                    <label>
                        <input type="checkbox" > Cấu hình mạnh
                    </label>
                    <label>
                        <input type="checkbox"> Độ phân giải cao
                    </label>
                    <label>
                        <input type="checkbox"> Tốc độ sạc nhanh
                    </label>
                    <label>
                        <input type="checkbox"> Tốc độ hao pin chậm
                    </label>

                <p>Đánh Giá Của Bạn Khi Trải Nghiệm Sản Phẩm</p>
                    <label>--Chọn Mức Độ--</label>
                    <select>
                        <option value="--Chọn Mức Độ">Chọn Mức Độ</option>
                        <option value="Rất hài long">Rất hài lòng</option>
                        <option value="Hài long">Hài lòng</option>
                        <option value="Bình Thường">Bình Thường</option>
                        <option value="Không Hài Lòng">Không Hài Lòng</option>
                        
                    </select>
                    <label for="comments">Ý kiến khác:</label>
                    <textarea id="comments" name="comments"></textarea>
                </div>
                <button type="submit">Gửi Phản Hồi</button>
            </div>
            <h2>Form Đặt Bàn Quán Ăn</h2>
            <div class="form">
                <div class="inf">
                    <label for="name">Họ và Tên:</label>
                    <input type="text" placeholder="name" required>
                    <label for="people">Số Người:</label>
                    <input type="number" placeholder="number" required>
                    <label for="date">Ngày-Giờ:</label>
                    <input type="datetime-local" placeholder="datetime" required>
                    <label for="require">Yêu cầu Đặc Biệt:</label>
                    <textarea id="require" placeholder="require"></textarea>
                
                </div>
                <button type="submit">Đặt Bàn</button>
            </div>
        </body>
    </html>

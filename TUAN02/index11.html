<DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale-1.0">
            <title>document</title>
        </head>
        <style>
            body{
                background-color: beige;
                text-align: center;
            }
            h2{
                border: 2px;
                background-color: aquamarine;
                gap:20px;
                padding: 10px;
                margin:auto;
                font-size:30px;
                color:rgb(17, 108, 108)
            }
            .form{
                display: flex;
                flex-direction: column;
                align-items: center;
                border: 2px;
                border-style: solid;
                background-color: azure;
                padding: 20px;
                width: fit-content;
                margin: auto;
                gap: 10px;
            }
            .inf{
                display: flex;
                flex-direction: column;
                gap:10px;
                box-shadow: 0 2px 4px rgba(45, 50, 25);
            }
            .form button{
                display: flex;
                justify-content: center;
                width: fit-content;
            }
            .inf input:hover{
                background-color: aquamarine;
            }
            .form button:hover{
                background-color: aquamarine;
                transform: scale(1.25)
            }
        </style>
        <body>
            <h2> Form Đăng Nhập</h2> 
           <div class="form">
                <div class="inf">
                    
                    <input type="text" placeholder="username" required>
                </div>
                <div class="inf">
                    
                    <input type="text" placeholder="password" required>
                </div>
                <button type="submit">Log in</button>
           </div>
        </body>
    </html>
